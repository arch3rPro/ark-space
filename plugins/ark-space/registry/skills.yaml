    path: skills/orchestrator
    status: active
    public: true
    capabilities: routing
    directInvocation: "/ark-space:orchestrator help me plan this task"
    orchestratorInvocation: "/ark-space:orchestrator help me plan this task"
    syncMode: local
    categories: meta,routing
    roles: orchestrator

